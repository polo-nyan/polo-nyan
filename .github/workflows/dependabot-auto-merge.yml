name: Dependabot auto-merge
# Plan-independent auto-merge that ALSO works on private repos. GitHub's native
# auto-merge (`gh pr merge --auto`) is plan-gated on private repos, so instead a
# daily reaper directly squash-merges Dependabot's GROUPED patch/minor PRs once
# their checks are green. Those PRs carry "minor-and-patch" in the branch name
# (per the group in dependabot.yml); major-version updates arrive as separate,
# ungrouped PRs and are intentionally left for manual review.
# Uses DEPENDABOT_AUTOMERGE_TOKEN (a PAT, set later) if present, else GITHUB_TOKEN.
#
# Implemented with actions/github-script (an authenticated Octokit client) so it
# runs on the self-hosted ARC runner image, which ships no `gh` CLI.
on:
  schedule:
    - cron: '35 4 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read      # read PR check-run state (github-script)
  statuses: read    # read legacy commit-status state

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  reap:
    runs-on: [self-hosted, linux]
    steps:
      - name: Merge green Dependabot patch/minor PRs
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.DEPENDABOT_AUTOMERGE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const [owner, repo] = process.env.GITHUB_REPOSITORY.split('/');

            // Open Dependabot PRs whose branch is the grouped patch/minor set.
            // Major-version updates arrive ungrouped (no "minor-and-patch" in the
            // branch name) and are intentionally left for manual review.
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const targets = prs.filter(pr =>
              (pr.user && (pr.user.login === 'dependabot[bot]' || pr.user.login === 'app/dependabot')) &&
              /minor-and-patch/.test(pr.head.ref)
            );

            if (targets.length === 0) {
              core.info('No grouped Dependabot PRs.');
              return;
            }

            for (const pr of targets) {
              const sha = pr.head.sha;

              // Combine check-runs (GitHub Actions/Apps) and legacy commit statuses,
              // mirroring `gh pr checks`: green if everything present succeeded, and
              // "no checks" also counts as mergeable.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner, repo, ref: sha, per_page: 100,
              });
              const statuses = await github.paginate(github.rest.repos.listCommitStatusesForRef, {
                owner, repo, ref: sha, per_page: 100,
              });

              // Latest status per context only.
              const latestStatus = new Map();
              for (const s of statuses) {
                if (!latestStatus.has(s.context)) latestStatus.set(s.context, s.state);
              }

              const passCheck = c =>
                c.status === 'completed' &&
                ['success', 'neutral', 'skipped'].includes(c.conclusion);
              const passStatus = state => state === 'success';

              const total = checkRuns.length + latestStatus.size;
              if (total === 0) {
                core.info(`PR #${pr.number}: no checks -> merging`);
              } else {
                const pending = checkRuns.some(c => c.status !== 'completed') ||
                  [...latestStatus.values()].some(st => st === 'pending');
                const failing = checkRuns.some(c => !passCheck(c)) ||
                  [...latestStatus.values()].some(st => !passStatus(st) && st !== 'pending');
                if (pending) { core.info(`PR #${pr.number}: checks pending -> skip this pass`); continue; }
                if (failing) { core.info(`PR #${pr.number}: checks failing -> skip this pass`); continue; }
                core.info(`PR #${pr.number}: checks green -> merging`);
              }

              try {
                await github.rest.pulls.merge({
                  owner, repo, pull_number: pr.number, merge_method: 'squash',
                });
                core.info(`PR #${pr.number}: merged`);
                // Best-effort delete of the head branch.
                try {
                  await github.rest.git.deleteRef({ owner, repo, ref: `heads/${pr.head.ref}` });
                } catch (e) {
                  core.info(`PR #${pr.number}: branch delete skipped (${e.status || e.message})`);
                }
              } catch (e) {
                core.info(`PR #${pr.number}: merge deferred (${e.status || e.message}: conflict/branch protection) — Dependabot will rebase`);
              }
            }
